<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stempel Geotag Foto + Peta (Auto EXIF Inject)</title>
<!-- Library membaca EXIF -->
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
<!-- Library menulis/memasukkan EXIF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.min.js"></script>
<style>
 body{font-family:Arial;max-width:720px;margin:18px auto;padding:0 14px;background:#f5f5f5}
 .card{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
 label{font-size:13px;color:#555;display:block;margin:8px 0 3px;font-weight:bold;}
 input,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
 .row{display:flex;gap:10px}.row>div{flex:1}
 button{padding:10px 18px;background:#1877f2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;margin:8px 8px 0 0;font-weight:bold;}
 button.sec{background:#5f6368}
 button.geo{background:#00897b}
 canvas{width:100%;border:1px solid #ccc;border-radius:6px;margin-top:10px}
 #st{font-size:13px;color:#777;font-style:italic;}
</style>
</head>
<body>
<div class="card">
 <h2 style="margin:0">📍 Stempel Geotag Foto + Peta</h2>
 <small style="color:#888">Auto-Inject EXIF Metadata (Visual + Digital File)</small>
 <label style="margin-top:10px">Pilih Foto</label>
 <input type="file" id="foto" accept="image/*">
</div>
<div class="card">
 <label>Baris 1 — Nama tempat (Besar)</label><input id="nama" value="Kantor Camat Sirimau">
 <label>Baris 2 — Alamat detail (Kecamatan / Desa)</label><input id="alamat" value="Sirimau, Ambon, Maluku">
 <button class="geo" onclick="cariKoordinat()">🔍 Cari Koordinat dari Alamat</button>
 
 <hr style="border:0;border-top:1px dashed #ccc;margin:15px 0;">

 <div class="row">
  <div><label>Latitude</label><input id="lat" value="-3.6934"></div>
  <div><label>Longitude</label><input id="lng" value="128.1818"></div>
  <div style="max-width:110px"><label>Zoom peta</label>
   <select id="zoom"><option>13</option><option>14</option><option selected>15</option><option>16</option><option>17</option></select>
  </div>
 </div>
 <button class="sec" onclick="lokasiSaya()">📍 Pakai lokasi GPS Perangkat Saat Ini</button>
 
 <div class="row" style="margin-top:5px;">
  <div><label>Tanggal</label><input id="tgl" type="date"></div>
  <div><label>Jam</label><input id="jam" type="time"></div>
  <div><label>Zona</label><input id="tz" value="WIT"></div>
 </div>
 <label>Note</label><input id="cat" value="Dokumentasi Kegiatan">
 
 <hr style="border:0;border-top:1px dashed #ccc;margin:15px 0;">
 
 <button onclick="render()">Buat Geotag</button>
 <button id="btnDl" style="display:none;background:#28a745;" onclick="unduh()">⬇ Download JPG (Inject EXIF)</button>
 <span id="st"></span>
</div>
<canvas id="cv"></canvas>

<script>
const $=id=>document.getElementById(id);
let img=null; const tileCache=new Map();
const two=n=>String(n).padStart(2,'0');
const MAX_IMG_SIZE = 1600; 

(()=>{const n=new Date();
 $('tgl').value=`${n.getFullYear()}-${two(n.getMonth()+1)}-${two(n.getDate())}`;
 $('jam').value=`${two(n.getHours())}:${two(n.getMinutes())}`;})();

function getDecimalGPS(data, ref) {
    if (!data) return null;
    let dec = data[0] + (data[1]/60) + (data[2]/3600);
    if (ref === 'S' || ref === 'W') dec *= -1;
    return dec.toFixed(6);
}

// Convert format desimal ke format rasional EXIF (Derajat, Menit, Detik)
function getExifGPSCoordinate(dec) {
    let abs = Math.abs(dec);
    let deg = Math.floor(abs);
    let min = Math.floor((abs - deg) * 60);
    let sec = Math.round(((abs - deg - (min / 60)) * 3600) * 100);
    return [[deg, 1], [min, 1], [sec, 100]];
}

$('foto').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    $('st').textContent = '⏳ Membaca metadata EXIF foto...';
    
    EXIF.getData(file, function() {
        const latArr = EXIF.getTag(this, "GPSLatitude");
        const latRef = EXIF.getTag(this, "GPSLatitudeRef");
        const lngArr = EXIF.getTag(this, "GPSLongitude");
        const lngRef = EXIF.getTag(this, "GPSLongitudeRef");
        const dateTaken = EXIF.getTag(this, "DateTimeOriginal");

        if(latArr && lngArr) {
            $('lat').value = getDecimalGPS(latArr, latRef);
            $('lng').value = getDecimalGPS(lngArr, lngRef);$('st').textContent = '✅ Koordinat EXIF ditemukan!';
        } else {
            $('st').textContent = '⚠️ EXIF tidak ada. Akan di-inject otomatis saat download.';
        }

        if(dateTaken) { 
            const parts = dateTaken.split(' ');
            if(parts.length === 2) {
                $('tgl').value = parts[0].replace(/:/g, '-');$('jam').value = parts[1].substring(0,5);
            }
        }
    });

    img = new Image();
    img.onload = render;
    img.src = URL.createObjectURL(file);
};

function lokasiSaya(){
    $('st').textContent='⏳ Melacak GPS perangkat...';
    navigator.geolocation?.getCurrentPosition(p=>{
        $('lat').value=p.coords.latitude.toFixed(6);$('lng').value=p.coords.longitude.toFixed(6);
        render();
    }, e => alert("Gagal melacak GPS. Pastikan izin lokasi browser aktif."));
}

async function cariKoordinat() {
    const query = $('nama').value.trim() + ', ' +$('alamat').value.trim();
    if (query.length < 5) return alert("Isi nama tempat dan alamat detail dengan jelas.");
    
    $('st').textContent = '⏳ Mencari koordinat...';
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data && data.length > 0) {
            $('lat').value = parseFloat(data[0].lat).toFixed(6);
            $('lng').value = parseFloat(data[0].lon).toFixed(6);$('st').textContent = '✅ Koordinat ditemukan dari alamat!';
            if(img) render();
        } else {
            $('st').textContent = '⚠️ Alamat tidak spesifik, koordinat tidak ditemukan.';
            alert("Koordinat tidak ditemukan. Coba gunakan nama kecamatan atau kota.");
        }
    } catch(err) {
        $('st').textContent = '⚠️ Gagal mencari koordinat.';
    }
}

function loadTile(z,x,y){
 const k=`${z}/${x}/${y}`;
 if(tileCache.has(k))return tileCache.get(k);
 const p=new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';
  i.onload=()=>res(i);i.onerror=rej;
  i.src=`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;});
 tileCache.set(k,p);return p;
}

async function buatPeta(lat,lon,z,dw,dh){
 const TS=256,n=Math.pow(2,z);
 const xt=(lon+180)/360*n;
 const yt=(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n;
 const tx=Math.floor(xt),ty=Math.floor(yt);
 const off=document.createElement('canvas');off.width=off.height=TS*3;
 const oc=off.getContext('2d');oc.fillStyle='#37474F';oc.fillRect(0,0,off.width,off.height);
 let ok=0;
 await Promise.all([...Array(3)].flatMap((_,a)=>[...Array(3)].map(async(_,b)=>{
  try{const im=await loadTile(z,tx+a-1,ty+b-1);oc.drawImage(im,a*TS,b*TS);ok++;}catch(e){}
 })));
 if(!ok)return{ok:false};
 const fx=(xt-(tx-1))*TS, fy=(yt-(ty-1))*TS;
 const cw=Math.min(TS*(dw/dh),TS*2), ch=cw*dh/dw;
 const cl=(v,lo,hi)=>Math.min(Math.max(v,lo),hi);
 return{ok:true,off,sx:cl(fx-cw/2,0,off.width-cw),sy:cl(fy-ch/2,0,off.height-ch),cw,ch};
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
 c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function pin(c,cx,cy,r){
 c.save();c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=r*.6;c.shadowOffsetY=r*.2;
 c.fillStyle='#E53935';c.strokeStyle='#9E1C1C';c.lineWidth=r*.14;
 c.beginPath();c.moveTo(cx,cy+r*.85);
 c.arc(cx,cy-r*.5,r,Math.PI*5/6,Math.PI/6+Math.PI*2,false);
 c.closePath();c.fill();c.shadowColor='transparent';c.stroke();c.restore();
}

function flag(c,x,y,w){const h=w*.68;
 c.fillStyle='#DD2C2C';c.fillRect(x,y,w,h/2);
 c.fillStyle='#fff';c.fillRect(x,y+h/2,w,h/2);
 c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;c.strokeRect(x,y,w,h);}

function tulis(c,t,x,y,maxW,fs,warna,bold=''){
 let s=fs;c.font=`${bold} ${s}px Arial`;
 while(c.measureText(t).width>maxW&&s>fs*.45){s*=.95;c.font=`${bold} ${s}px Arial`;}
 c.fillStyle=warna;c.fillText(t,x,y);}

async function render(){
 if(!img)return;
 $('st').textContent='⏳ Memproses gambar & memuat peta...';
 
 let scale = 1;
 if (img.naturalWidth > MAX_IMG_SIZE || img.naturalHeight > MAX_IMG_SIZE) {
     scale = Math.min(MAX_IMG_SIZE / img.naturalWidth, MAX_IMG_SIZE / img.naturalHeight);
 }
 const W = img.naturalWidth * scale;
 const H = img.naturalHeight * scale;
 
 cv.width = W; cv.height = H;
 const c = cv.getContext('2d');
 
 c.drawImage(img, 0, 0, W, H);
 
 const f1=W*.037,f2=W*.020,f3=W*.0225,f4=W*.0205,pad=W*.011,padX=W*.014;
 const judul=$('nama').value.trim(), alamat=$('alamat').value.trim();
 const koord=`Lat ${$('lat').value}, Long ${$('lng').value}`;
 const d=$('tgl').value?new Date($('tgl').value+'T00:00:00'):new Date();
 const hari=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][d.getDay()];
 let[h,m]=$('jam').value.split(':');h=+h;
 const waktu=`${hari}, ${two(d.getDate())}/${two(d.getMonth()+1)}/${d.getFullYear()} ${h%12||12}:${m} ${h>=12?'PM':'AM'} ${$('tz').value}`;
 const note='Note : '+($('cat').value.trim()||'-');
 const tot=f1*1.16+(f2+f3*2+f4)*1.36+pad*2;
 const stripH=Math.round(Math.min(Math.max(tot,W*.15),W*.25));
 const y0=H-stripH, mapW=Math.round(stripH);
 
 const peta=await buatPeta(parseFloat($('lat').value),parseFloat($('lng').value),+$('zoom').value,mapW,stripH);
 if(peta.ok)c.drawImage(peta.off,peta.sx,peta.sy,peta.cw,peta.ch,0,y0,mapW,stripH);
 else{c.fillStyle='#455A64';c.fillRect(0,y0,mapW,stripH);}
 
 c.font=`${f2*.95}px Arial`;c.textBaseline='middle';
 const sL='Satellite © Esri', sw=c.measureText(sL).width;
 c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,y0+stripH-f2*1.7,sw+padX,f2*1.7);
 c.fillStyle='#fff';c.fillText(sL,padX*.6,y0+stripH-f2*.85);
 
 pin(c,mapW/2,y0+stripH*.60,stripH*.155);
 
 c.fillStyle='rgba(0,0,0,.78)';c.fillRect(mapW,y0,W-mapW,stripH);
 const tx=mapW+padX, maxW=W-mapW-padX*2;
 c.textBaseline='top';
 let y=y0+pad;
 
 c.font=`bold ${f1}px Arial`;
 let tw=c.measureText(judul).width, fw=f1*.62, gap=f1*.28;
 while(judul&&tw+fw+gap>maxW&&f1>2){c.font=`bold ${f1*.97}px Arial`;tw=c.measureText(judul).width;}
 c.fillStyle='#fff';if(judul)c.fillText(judul,tx,y);
 flag(c,tx+tw+gap,y+f1*.14,fw);
 y+=f1*1.16+pad*.2;
 tulis(c,alamat,tx,y,maxW,f2,'#d9d9d9'); y+=f2*1.36;
 tulis(c,koord,tx,y,maxW,f3,'#fff');     y+=f3*1.36;
 tulis(c,waktu,tx,y,maxW,f3,'#fff');     y+=f3*1.36;
 tulis(c,note,tx,y,maxW,f4,'#e8e8e8');
 
 const bh=stripH*.22,bw=bh*2.55,mg=W*.008;
 const bx=W-bw-mg, by=y0-bh*.30;
 rr(c,bx,by,bw,bh,bh*.3);c.fillStyle='rgba(20,20,20,.85)';c.fill();
 c.fillStyle='#2ECC40';c.beginPath();c.arc(bx+bh*.55,by+bh/2,bh*.16,0,7);c.fill();
 c.fillStyle='#fff';c.font=`bold ${bh*.5}px Arial`;c.textBaseline='middle';
 c.fillText('GPS',bx+bh*.95,by+bh*.56);
 
 $('btnDl').style.display='inline-block';$('st').textContent='✅ Selesai — cek preview lalu Download JPG';
}

function unduh(){
    $('st').textContent='⏳ Menanamkan (Injecting) EXIF & Mengunduh...';
    
    // 1. Ambil format Base64 dari Canvas
    const jpegData = cv.toDataURL('image/jpeg', 0.90);
    
    try {
        // 2. Siapkan data Latitude, Longitude, & Waktu
        let lat = parseFloat($('lat').value);
        let lng = parseFloat($('lng').value);
        let latRef = lat < 0 ? "S" : "N";
        let lngRef = lng < 0 ? "W" : "E";
        
        let tgl = $('tgl').value.replace(/-/g, ":"); 
        let jam = $('jam').value;
        if(jam.length === 5) jam += ":00";
        let dateTimeStr = tgl + " " + jam;

        // 3. Bangun struktur EXIF IFD
        let zerothIfd = {};
        let exifIfd = {};
        let gpsIfd = {};

        zerothIfd[piexif.ImageIFD.DateTime] = dateTimeStr;
        exifIfd[piexif.ExifIFD.DateTimeOriginal] = dateTimeStr;
        exifIfd[piexif.ExifIFD.DateTimeDigitized] = dateTimeStr;

        gpsIfd[piexif.GPSIFD.GPSLatitudeRef] = latRef;
        gpsIfd[piexif.GPSIFD.GPSLatitude] = getExifGPSCoordinate(lat);
        gpsIfd[piexif.GPSIFD.GPSLongitudeRef] = lngRef;
        gpsIfd[piexif.GPSIFD.GPSLongitude] = getExifGPSCoordinate(lng);

        let exifObj = {"0th": zerothIfd, "Exif": exifIfd, "GPS": gpsIfd};
        let exifBytes = piexif.dump(exifObj);
        
        // 4. Masukkan struktur EXIF ke dalam Data Gambar
        let newJpeg = piexif.insert(exifBytes, jpegData);
        
        // 5. Unduh file hasil injeksi
        const a = document.createElement('a');
        a.download = `Geotag_${$('tgl').value}_${$('jam').value.replace(':','')}.jpg`;
        a.href = newJpeg;
        a.click();
        $('st').textContent='✅ File berhasil diunduh dengan Metadata!';
        
    } catch (e) {
        // Fallback jika terjadi error pada Piexif
        console.error("Gagal inject EXIF: ", e);
        const a = document.createElement('a');
        a.download = `Geotag_${$('tgl').value}_${$('jam').value.replace(':','')}.jpg`;
        a.href = jpegData;
        a.click();
        $('st').textContent='⚠️ Diunduh tanpa Metadata (Error Inject).';
    }
}

['lat','lng','zoom','tgl','jam','tz','cat'].forEach(id=>$(id).addEventListener('change',render));
['nama','alamat'].forEach(id=>$(id).addEventListener('change', () => { if(img) render(); }));
</script>
</body>
</html>
