<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stempel Geotag Foto + Peta (GPS Map Camera Style)</title>
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.min.js"></script>
<style>
 body{font-family:Arial,sans-serif;max-width:720px;margin:18px auto;padding:0 14px;background:#f5f5f5}
 .card{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
 label{font-size:13px;color:#555;display:block;margin:8px 0 3px;font-weight:bold;}
 input,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
 .row{display:flex;gap:10px}.row>div{flex:1}
 button{padding:10px 18px;background:#1877f2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;margin:8px 8px 0 0;font-weight:bold;}
 button.sec{background:#5f6368}
 button.geo{background:#00897b}
 canvas{width:100%;border:1px solid #ccc;border-radius:6px;margin-top:10px}
 #st{font-size:13px;color:#777;font-style:italic;}
</style>
</head>
<body>
<div class="card">
 <h2 style="margin:0">📍 Stempel Geotag Foto + Peta</h2>
 <small style="color:#888">Gaya GPS Map Camera — Panel Full Width, Ramping & Presisi</small>
 <label style="margin-top:10px">Pilih Foto</label>
 <input type="file" id="foto" accept="image/*">
</div>
<div class="card">
 <label>Baris 1 — Nama tempat (Besar)</label><input id="nama" value="Ambon, Maluku, Indonesia">
 <label>Baris 2 — Alamat detail</label><input id="alamat" value="Tantui, Sirimau, Ambon, Maluku, Indonesia">
 <button class="geo" onclick="cariKoordinat()">🔍 Cari Koordinat dari Alamat</button>
 
 <hr style="border:0;border-top:1px dashed #ccc;margin:15px 0;">

 <div class="row">
  <div><label>Latitude</label><input id="lat" value="-3.6705"></div>
  <div><label>Longitude</label><input id="lng" value="128.1908"></div>
  <div style="max-width:110px"><label>Zoom peta</label>
   <select id="zoom"><option>13</option><option>14</option><option selected>15</option><option>16</option><option>17</option></select>
  </div>
 </div>
 <button class="sec" onclick="lokasiSaya()">📍 Pakai lokasi GPS Perangkat Saat Ini</button>
 
 <div class="row" style="margin-top:5px;">
  <div><label>Tanggal</label><input id="tgl" type="date"></div>
  <div><label>Jam</label><input id="jam" type="time"></div>
  <div><label>Zona Waktu</label><input id="tz" value="GMT+09:00"></div>
 </div>
 <label>Note</label><input id="cat" value="Captured by GPS Map Camera">
 
 <hr style="border:0;border-top:1px dashed #ccc;margin:15px 0;">
 
 <button onclick="render()">Buat Geotag</button>
 <button id="btnDl" style="display:none;background:#28a745;" onclick="unduh()">⬇ Download JPG (Inject EXIF)</button>
 <span id="st"></span>
</div>
<canvas id="cv"></canvas>

<script>
const $=id=>document.getElementById(id);
let img=null; const tileCache=new Map();
const two=n=>String(n).padStart(2,'0');
const MAX_IMG_SIZE = 1200; 

(()=>{const n=new Date();
 $('tgl').value=`${n.getFullYear()}-${two(n.getMonth()+1)}-${two(n.getDate())}`;
 $('jam').value=`${two(n.getHours())}:${two(n.getMinutes())}`;})();

function getDecimalGPS(data, ref) {
    if (!data) return null;
    let dec = data[0] + (data[1]/60) + (data[2]/3600);
    if (ref === 'S' || ref === 'W') dec *= -1;
    return dec.toFixed(6);
}

function getExifGPSCoordinate(dec) {
    let abs = Math.abs(dec);
    let deg = Math.floor(abs);
    let min = Math.floor((abs - deg) * 60);
    let sec = Math.round(((abs - deg - (min / 60)) * 3600) * 100);
    return [[deg, 1], [min, 1], [sec, 100]];
}

$('foto').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    $('st').textContent = '⏳ Membaca metadata EXIF foto...';
    
    EXIF.getData(file, function() {
        const latArr = EXIF.getTag(this, "GPSLatitude");
        const latRef = EXIF.getTag(this, "GPSLatitudeRef");
        const lngArr = EXIF.getTag(this, "GPSLongitude");
        const lngRef = EXIF.getTag(this, "GPSLongitudeRef");
        const dateTaken = EXIF.getTag(this, "DateTimeOriginal");

        if(latArr && lngArr) {
            $('lat').value = getDecimalGPS(latArr, latRef);
            $('lng').value = getDecimalGPS(lngArr, lngRef);$('st').textContent = '✅ Koordinat EXIF ditemukan!';
        } else {
            $('st').textContent = '⚠️ EXIF GPS tidak ditemukan. Akan di-inject saat download.';
        }

        if(dateTaken) { 
            const parts = dateTaken.split(' ');
            if(parts.length === 2) {
                $('tgl').value = parts[0].replace(/:/g, '-');$('jam').value = parts[1].substring(0,5);
            }
        }
    });

    img = new Image();
    img.onload = render;
    img.src = URL.createObjectURL(file);
};

function lokasiSaya(){
    $('st').textContent='⏳ Melacak GPS...';
    navigator.geolocation?.getCurrentPosition(p=>{
        $('lat').value=p.coords.latitude.toFixed(6);$('lng').value=p.coords.longitude.toFixed(6);
        render();
    }, e => alert("Gagal melacak GPS."));
}

async function cariKoordinat() {
    const nama = $('nama').value.trim();
    const alamat = $('alamat').value.trim();
    if (!nama && !alamat) return alert("Isi nama tempat atau alamat.");
    
    $('st').textContent = '⏳ Mencari koordinat...';
    const bersihkan = (text) => text.replace(/Kecamatan|Kota|Provinsi|Kabupaten/gi, '').replace(/\s+/g, ' ').trim();
    const namaBersih = bersihkan(nama);
    const alamatBersih = bersihkan(alamat);

    const queries = [
        `${alamat}, ${nama}`,
        `${alamatBersih}, ${namaBersih}`,
        `${alamat}, Ambon`,
        `${alamatBersih}, Ambon`,
        `${nama}, ${alamat}`,
        `${namaBersih}`,
        `${alamat}`
    ];
    const uniqueQueries = [...new Set(queries)].filter(q => q && q.length > 2);

    for (let q of uniqueQueries) {
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
            const data = await res.json();
            if (data && data.length > 0) {
                $('lat').value = parseFloat(data[0].lat).toFixed(6);
                $('lng').value = parseFloat(data[0].lon).toFixed(6);$('st').textContent = `✅ Koordinat ditemukan!`;
                if(img) render();
                return;
            }
        } catch(e){}
    }
    $('st').textContent = '⚠️ Koordinat tidak ditemukan.';
}

function loadTile(z,x,y){
 const k=`${z}/${x}/${y}`;
 if(tileCache.has(k))return tileCache.get(k);
 const p=new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';
  i.onload=()=>res(i);i.onerror=rej;
  i.src=`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;});
 tileCache.set(k,p);return p;
}

async function buatPeta(lat,lon,z,dw,dh){
 const TS=256,n=Math.pow(2,z);
 const xt=(lon+180)/360*n;
 const yt=(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n;
 const tx=Math.floor(xt),ty=Math.floor(yt);
 const off=document.createElement('canvas');off.width=off.height=TS*3;
 const oc=off.getContext('2d');oc.fillStyle='#37474F';oc.fillRect(0,0,off.width,off.height);
 let ok=0;
 await Promise.all([...Array(3)].flatMap((_,a)=>[...Array(3)].map(async(_,b)=>{
  try{const im=await loadTile(z,tx+a-1,ty+b-1);oc.drawImage(im,a*TS,b*TS);ok++;}catch(e){}
 })));
 if(!ok)return{ok:false};
 const fx=(xt-(tx-1))*TS, fy=(yt-(ty-1))*TS;
 const cw=Math.min(TS*(dw/dh),TS*2), ch=cw*dh/dw;
 const cl=(v,lo,hi)=>Math.min(Math.max(v,lo),hi);
 return{ok:true,off,sx:cl(fx-cw/2,0,off.width-cw),sy:cl(fy-ch/2,0,off.height-ch),cw,ch};
}

function rr(c,x,y,w,h,r, rTopLeft=r, rTopRight=r, rBottomRight=r, rBottomLeft=r){
    c.beginPath();
    c.moveTo(x + rTopLeft, y);
    c.lineTo(x + w - rTopRight, y);
    c.quadraticCurveTo(x + w, y, x + w, y + rTopRight);
    c.lineTo(x + w, y + h - rBottomRight);
    c.quadraticCurveTo(x + w, y + h, x + w - rBottomRight, y + h);
    c.lineTo(x + rBottomLeft, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - rBottomLeft);
    c.lineTo(x, y + rTopLeft);
    c.quadraticCurveTo(x, y, x + rTopLeft, y);
    c.closePath();
}

function pin(c,cx,cy,r){
 c.save();
 c.shadowColor='rgba(0,0,0,0.5)';c.shadowBlur=r*0.4;c.shadowOffsetY=r*0.15;
 c.fillStyle='#EA4335';c.strokeStyle='#B31412';c.lineWidth=r*0.08;
 c.beginPath();c.moveTo(cx,cy);
 c.arc(cx,cy-r*0.85,r*0.55,Math.PI*0.78,Math.PI*0.22,false);
 c.closePath();c.fill();c.stroke();
 c.fillStyle='#7A0A0A';c.beginPath();c.arc(cx,cy-r*0.85,r*0.22,0,Math.PI*2);c.fill();
 c.restore();
}

function drawMapText(c, text, x, y, size) {
    if(!text) return;
    c.save();
    c.font = `bold ${size}px Arial`;
    c.textBaseline = 'alphabetic';
    c.strokeStyle = '#000000';
    c.lineWidth = size * 0.22;
    c.lineJoin = 'round';
    c.strokeText(text, x, y);
    c.fillStyle = '#FFFEE4';
    c.fillText(text, x, y);
    c.restore();
}

function flag(c,x,y,w){const h=w*.65;
 c.save();
 c.fillStyle='#DD2C2C';c.fillRect(x,y,w,h/2);
 c.fillStyle='#fff';c.fillRect(x,y+h/2,w,h/2);
 c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;c.strokeRect(x,y,w,h);
 c.restore();
}

function tulis(c,t,x,y,maxW,fs,warna,bold=''){
 let s=fs;c.font=`${bold} ${s}px Arial`;
 while(c.measureText(t).width>maxW&&s>fs*.45){
     s*=.95;
     c.font=`${bold} ${s}px Arial`;
 }
 c.fillStyle=warna;c.fillText(t,x,y);}

async function render(){
 if(!img)return;
 $('st').textContent='⏳ Memproses gambar & memuat peta...';
 
 let scale = 1;
 if (img.naturalWidth > MAX_IMG_SIZE || img.naturalHeight > MAX_IMG_SIZE) {
     scale = Math.min(MAX_IMG_SIZE / img.naturalWidth, MAX_IMG_SIZE / img.naturalHeight);
 }
 const W = img.naturalWidth * scale;
 const H = img.naturalHeight * scale;
 
 cv.width = W; cv.height = H;
 const c = cv.getContext('2d');
 c.drawImage(img, 0, 0, W, H);

 // --- PENGATURAN PANEL (FULL WIDTH & LEBIH PENDEK) ---
 // Tinggi panel diatur lebih kecil: antara 15% - 20% dari lebar, maksimal 130px agar ramping
 const cardH = Math.round(Math.min(Math.max(W * 0.15, 80), W * 0.22)); 
 const cardW = W; // Full width menutupi foto dari kiri ke kanan
 const cardX = 0;
 const cardY = H - cardH - (W * 0.015); // Sedikit margin dari bawah foto
 const cornerRadius = cardH * 0.12;

 // Background Panel Gelap Transparan
 c.save();
 rr(c, cardX, cardY, cardW, cardH, cornerRadius, cornerRadius, cornerRadius, cornerRadius);
 c.fillStyle = 'rgba(0, 0, 0, 0.70)';
 c.fill();
 c.restore();

 // --- PETA SATELIT (KIRI) ---
 const mapH = cardH;
 const mapW = mapH; // Peta berbentuk persegi
 const mapX = cardX;
 const mapY = cardY;

 const peta = await buatPeta(parseFloat($('lat').value), parseFloat($('lng').value), +$('zoom').value, mapW, mapH);
 
 c.save();
 // Round corner peta disamakan dengan panel
 rr(c, mapX, mapY, mapW, mapH, cornerRadius, 0, 0, cornerRadius); 
 c.clip();
 if (peta.ok) {
     c.drawImage(peta.off, peta.sx, peta.sy, peta.cw, peta.ch, mapX, mapY, mapW, mapH);
 } else {
     c.fillStyle = '#37474F';
     c.fillRect(mapX, mapY, mapW, mapH);
 }
 
 pin(c, mapX + mapW / 2, mapY + mapH * 0.52, mapH * 0.20);
 
 const alamatParts = $('alamat').value.split(',').map(s=>s.trim()).filter(Boolean);
 const pinLabel = alamatParts[0] || 'Tantui';
 const cityLabel = alamatParts[2] || alamatParts[1] || $('nama').value.split(',')[0].trim() || 'Ambon';

 drawMapText(c, pinLabel, mapX + mapW / 2 + mapH * 0.10, mapY + mapH * 0.52, mapH * 0.13);
 drawMapText(c, cityLabel, mapX + mapH * 0.05, mapY + mapH * 0.90, mapH * 0.16);
 c.restore();

 // --- PANEL TEKS & BADGE ---
 const textX = mapX + mapW + W * 0.02; // Jarak dari peta
 const textMaxW = cardW - mapW - W * 0.04;
 
 // Badge GPS (Pojok Kanan Atas)
 const badgeH = cardH * 0.18;
 const badgeW = badgeH * 5.2;
 const badgeX = cardX + cardW - badgeW - (W * 0.015);
 const badgeY = cardY + (cardH * 0.08);

 c.save();
 rr(c, badgeX, badgeY, badgeW, badgeH, badgeH * 0.3);
 c.fillStyle = 'rgba(25, 25, 25, 0.85)';
 c.fill();
 
 const iconS = badgeH * 0.60;
 const iconX = badgeX + badgeH * 0.25;
 const iconY = badgeY + (badgeH - iconS) / 2;
 rr(c, iconX, iconY, iconS, iconS, iconS * 0.2);
 c.fillStyle = '#2ECC40'; c.fill();
 c.fillStyle = '#0074D9'; c.fillRect(iconX + iconS*0.2, iconY + iconS*0.2, iconS*0.6, iconS*0.6);
 
 c.fillStyle = '#FFFFFF';
 c.font = `bold ${badgeH * 0.55}px Arial`;
 c.textBaseline = 'middle';
 c.fillText('GPS Map Camera', iconX + iconS + badgeH * 0.3, badgeY + badgeH / 2);
 c.restore();

 const d = $('tgl').value ? new Date($('tgl').value + 'T00:00:00') : new Date();
 const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][d.getDay()];
 const tglFormatted = `${two(d.getDate())}/${two(d.getMonth()+1)}/${d.getFullYear()}`;
 let [h, m] = $('jam').value.split(':'); h = +h;
 const ampm = h >= 12 ? 'PM' : 'AM';
 const h12 = h % 12 || 12;
 const waktu = `${hari}, ${tglFormatted} ${two(h12)}:${m} ${ampm} ${$('tz').value}`;

 const judul = $('nama').value.trim();
 const alamat = $('alamat').value.trim();
 const koord = `Lat ${$('lat').value}, Long ${$('lng').value}`;
 const note = 'Note : ' + ($('cat').value.trim() || '-');

 // --- PENGATURAN FONT (LEBIH KECIL & PRESISI) ---
 const padY = cardH * 0.08;
 const f1 = cardH * 0.17; // Judul lebih kecil proporsional
 const f2 = cardH * 0.12; 
 const f3 = cardH * 0.12;
 const f4 = cardH * 0.12;
 const f5 = cardH * 0.10;
 const lineGap = cardH * 0.04;

 c.textBaseline = 'top';
 let y = cardY + padY;

 // Baris 1: Judul
 const maxW1 = textMaxW - badgeW - W * 0.01;
 let curF1 = f1;
 c.font = `bold ${curF1}px Arial`;
 let tw = c.measureText(judul).width, fw = curF1 * 0.65, gap = curF1 * 0.3;
 while(judul && tw + fw + gap > maxW1 && curF1 > 6){
     curF1 *= 0.95;
     c.font = `bold ${curF1}px Arial`;
     tw = c.measureText(judul).width;
     fw = curF1 * 0.65; gap = curF1 * 0.3;
 }
 c.fillStyle = '#FFFEE4';
 if(judul) c.fillText(judul, textX, y);
 if(judul) flag(c, textX + tw + gap, y + curF1 * 0.12, fw);
 y += curF1 + lineGap;

 // Sisa Baris
 tulis(c, alamat, textX, y, textMaxW, f2, '#FFFEE4'); y += f2 + lineGap;
 tulis(c, koord, textX, y, textMaxW, f3, '#FFFEE4');  y += f3 + lineGap;
 tulis(c, waktu, textX, y, textMaxW, f4, '#FFFEE4');  y += f4 + lineGap;
 tulis(c, note, textX, y, textMaxW, f5, '#E0E0E0');

 $('btnDl').style.display = 'inline-block';$('st').textContent = '✅ Selesai — cek preview lalu Download JPG';
}

function unduh(){
    $('st').textContent='⏳ Menanamkan (Injecting) EXIF & Mengunduh...';
    const jpegData = cv.toDataURL('image/jpeg', 0.90);
    
    try {
        let lat = parseFloat($('lat').value);
        let lng = parseFloat($('lng').value);
        let latRef = lat < 0 ? "S" : "N";
        let lngRef = lng < 0 ? "W" : "E";
        
        let tgl = $('tgl').value.replace(/-/g, ":"); 
        let jam = $('jam').value;
        if(jam.length === 5) jam += ":00";
        let dateTimeStr = tgl + " " + jam;

        let zerothIfd = {};
        let exifIfd = {};
        let gpsIfd = {};

        zerothIfd[piexif.ImageIFD.DateTime] = dateTimeStr;
        exifIfd[piexif.ExifIFD.DateTimeOriginal] = dateTimeStr;
        exifIfd[piexif.ExifIFD.DateTimeDigitized] = dateTimeStr;

        gpsIfd[piexif.GPSIFD.GPSLatitudeRef] = latRef;
        gpsIfd[piexif.GPSIFD.GPSLatitude] = getExifGPSCoordinate(lat);
        gpsIfd[piexif.GPSIFD.GPSLongitudeRef] = lngRef;
        gpsIfd[piexif.GPSIFD.GPSLongitude] = getExifGPSCoordinate(lng);

        let exifObj = {"0th": zerothIfd, "Exif": exifIfd, "GPS": gpsIfd};
        let exifBytes = piexif.dump(exifObj);
        
        let newJpeg = piexif.insert(exifBytes, jpegData);
        
        const a = document.createElement('a');
        a.download = `Geotag_${$('tgl').value}_${$('jam').value.replace(':','')}.jpg`;
        a.href = newJpeg;
        a.click();
        $('st').textContent='✅ File berhasil diunduh dengan Metadata!';
    } catch (e) {
        console.error("Gagal inject EXIF: ", e);
        const a = document.createElement('a');
        a.download = `Geotag_${$('tgl').value}_${$('jam').value.replace(':','')}.jpg`;
        a.href = jpegData;
        a.click();
        $('st').textContent='⚠️ Diunduh tanpa Metadata (Error Inject).';
    }
}

['lat','lng','zoom','tgl','jam','tz','cat'].forEach(id=>$(id).addEventListener('change',render));
['nama','alamat'].forEach(id=>$(id).addEventListener('change', () => { if(img) render(); }));
</script>
</body>
</html>
